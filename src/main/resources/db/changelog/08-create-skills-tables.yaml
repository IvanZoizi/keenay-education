databaseChangeLog:
  - changeSet:
      id: 8
      author: system
      changes:
        - createTable:
            tableName: skills
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: seller_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: animal_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: deleted_at
                  type: TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: skills
            baseColumnNames: seller_id
            referencedTableName: sellers
            referencedColumnNames: id
            constraintName: fk_skills_sellers
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: skills
            baseColumnNames: animal_id
            referencedTableName: animals
            referencedColumnNames: id
            constraintName: fk_skills_animals
            onDelete: RESTRICT