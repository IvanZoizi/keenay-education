databaseChangeLog:
  - changeSet:
      id: 7
      author: system
      changes:
        - createTable:
            tableName: pets_profile
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: pet_id
                  type: BIGINT
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: breed
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: features
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: vaccinations
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: deleted_at
                  type: TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: pets_profile
            baseColumnNames: pet_id
            referencedTableName: pets
            referencedColumnNames: id
            constraintName: fk_pets_profile_pets
            onDelete: CASCADE