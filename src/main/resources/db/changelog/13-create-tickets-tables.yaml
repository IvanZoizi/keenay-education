databaseChangeLog:
  - changeSet:
      id: 13
      author: system
      changes:
        - createTable:
            tableName: tickets
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: admin_id
                  type: BIGINT
              - column:
                  name: sender_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: question
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: tickets
            baseColumnNames: admin_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_tickets_admin
            onDelete: SET NULL
        - addForeignKeyConstraint:
            baseTableName: tickets
            baseColumnNames: sender_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_tickets_sender
            onDelete: CASCADE
        - createIndex:
            indexName: idx_tickets_sender_id
            tableName: tickets
            columns:
              - column:
                  name: sender_id
        - createIndex:
            indexName: idx_tickets_admin_id
            tableName: tickets
            columns:
              - column:
                  name: admin_id
        - createTable:
            tableName: tickets_replies
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: ticket_id
                  type: BIGINT
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: answer
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: tickets_replies
            baseColumnNames: ticket_id
            referencedTableName: tickets
            referencedColumnNames: id
            constraintName: fk_ticket_replies_tickets
            onDelete: CASCADE