databaseChangeLog:
  - changeSet:
      id: 9
      author: system
      changes:
        - createTable:
            tableName: advertisement
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: pet_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: client_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: selected_response_id
                  type: BIGINT
              - column:
                  name: status
                  type: VARCHAR(20)
              - column:
                  name: budget
                  type: INT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: advertisement
            baseColumnNames: pet_id
            referencedTableName: pets
            referencedColumnNames: id
            constraintName: fk_advertisement_pets
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: advertisement
            baseColumnNames: client_id
            referencedTableName: customers
            referencedColumnNames: id
            constraintName: fk_advertisement_customers
            onDelete: CASCADE